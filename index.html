<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pletina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#E2E5E9">
<meta name="description" content="Reproductor de MP3 y MP4 sin anuncios, con listas de reproducción y sin conexión.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pletina">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Michroma&amp;family=Share+Tech+Mono&amp;display=swap">
<style>
:root{
  /* Layout: una sola pantalla tipo pletina — barra superior, vista con scroll, mini-reproductor y botonera inferior; «Reproduciendo» sube como el frontal del aparato */
  --bg:#E2E5E9;--panel:#F4F5F7;--well:#CDD2D9;--ink:#15181C;--muted:#59616B;--line:#C6CCD3;
  --rec:#C42F1B;--rec-ink:#FFFFFF;
  --lcd:#0D0E10;--lcd-ink:#FFB13D;--lcd-dim:#5A4019;--lcd-edge:#2A2D31;
  --key-top:#FBFCFD;--key-bot:#C9CED5;--key-edge:#8E959E;--led-off:#A3AAB3;
  --shade:rgba(18,22,28,.12);--scrim:rgba(10,12,15,.45);--tint:#7D6A55;
  --f-panel:"Michroma","Eurostile","Microgramma","Arial Black",sans-serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-lcd:"Share Tech Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417;--panel:#1C1F23;--well:#0B0C0E;--ink:#E8EAED;--muted:#9AA2AC;--line:#2C3137;
  --rec:#FF5340;--rec-ink:#1A0703;
  --lcd:#060708;--lcd-ink:#FFB648;--lcd-dim:#4E3714;--lcd-edge:#24272B;
  --key-top:#3C4149;--key-bot:#262A30;--key-edge:#08090A;--led-off:#4A5058;
  --shade:rgba(0,0,0,.4);--scrim:rgba(0,0,0,.62);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417;--panel:#1C1F23;--well:#0B0C0E;--ink:#E8EAED;--muted:#9AA2AC;--line:#2C3137;
  --rec:#FF5340;--rec-ink:#1A0703;
  --lcd:#060708;--lcd-ink:#FFB648;--lcd-dim:#4E3714;--lcd-edge:#24272B;
  --key-top:#3C4149;--key-bot:#262A30;--key-edge:#08090A;--led-off:#4A5058;
  --shade:rgba(0,0,0,.4);--scrim:rgba(0,0,0,.62);color-scheme:dark}

html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
img{max-width:100%}
:focus-visible{outline:2px solid var(--rec);outline-offset:2px}
.ic{width:22px;height:22px;flex:0 0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;position:relative}

/* barra superior */
.top{display:flex;align-items:center;gap:10px;padding:10px var(--gr) 6px var(--gl);min-height:56px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-panel);font-size:14px;letter-spacing:.2em}
.led-rec{width:9px;height:9px;border-radius:50%;background:var(--led-off);transition:background .2s,box-shadow .2s}
body.is-playing .led-rec,body.recording .led-rec{background:var(--rec);box-shadow:0 0 8px var(--rec)}
body.recording .led-rec{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.counter{margin-left:auto;font:13px/1 var(--f-lcd);color:var(--lcd-ink);background:var(--lcd);padding:6px 9px;border-radius:6px;letter-spacing:.08em;font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 4px rgba(0,0,0,.7);text-shadow:0 0 6px color-mix(in srgb,var(--lcd-ink) 50%,transparent);white-space:nowrap}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:0;background:none;border-radius:50%;color:var(--ink);flex:0 0 auto}
.icon-btn:active{background:var(--well)}
.searchbar{display:flex;gap:8px;align-items:center;padding:0 var(--gr) 8px var(--gl)}
.searchbar input{flex:1;min-width:0}
.link{border:0;background:none;color:var(--rec);font-weight:600;padding:8px 4px}

input[type=text],input[type=search],select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 12px;font:inherit;font-size:16px;width:100%}
select{width:auto;padding-right:28px;font-size:14px;height:36px}

/* vistas */
#view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px var(--gr) 28px var(--gl);overscroll-behavior:contain}
.vh{display:flex;flex-direction:column;gap:2px;margin:6px 0 14px}
.eyebrow{font-family:var(--f-panel);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.vh h1,.pl-info h1{margin:0;font-size:30px;line-height:1.08;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.row-h{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:12px}
.vh-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.sort select{border:0;background:transparent;color:var(--muted);font-weight:600;height:34px;padding:0 2px;text-align:right;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn:active{transform:translateY(1px)}
.btn-rec{background:var(--rec);color:var(--rec-ink);border-color:transparent}
.btn-ghost{background:transparent}
.btn.on{border-color:var(--rec);color:var(--rec)}
.btn.danger{color:var(--rec);border-color:color-mix(in srgb,var(--rec) 45%,var(--line))}
.btn.danger-fill{background:var(--rec);color:var(--rec-ink);border-color:transparent}
.toolbar{display:flex;gap:8px;align-items:center;margin:0 0 6px}
.seg{display:flex;flex:1;min-width:0;background:var(--well);padding:3px;border-radius:10px;gap:3px;overflow-x:auto;scrollbar-width:none;box-shadow:inset 0 1px 3px var(--shade)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;padding:8px 10px;border-radius:7px;font-family:var(--f-panel);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:linear-gradient(var(--key-top),var(--key-bot));color:var(--ink);box-shadow:0 1px 0 var(--key-edge),0 2px 4px var(--shade)}
.seg.small{flex:0 0 auto}
.sec{font-family:var(--f-panel);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:400;margin:22px 0 8px}
.sec .src{font-family:var(--f-ui);letter-spacing:0;text-transform:none;font-size:13px}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hint{color:var(--muted);font-size:14px;max-width:60ch}
.hint .ic{width:16px;height:16px;vertical-align:-3px}
.empty-q{color:var(--muted);padding:18px 0}

/* filas */
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;border-bottom:1px solid var(--line);position:relative;background:var(--bg);touch-action:pan-y;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.row img{-webkit-user-drag:none}
.row:not(.dragging){transition:transform .16s ease}
.row.dragging{z-index:3;background:var(--panel);box-shadow:0 14px 34px var(--shade);border-radius:12px;scale:1.02}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 0;border:0;background:none;text-align:left}
.thumb{position:relative;flex:0 0 48px;width:48px;height:48px;border-radius:6px;overflow:hidden;background:var(--well)}
.thumb.sm{flex-basis:40px;width:40px;height:40px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb img:not([src]){visibility:hidden}
.badge-vid{position:absolute;right:3px;bottom:3px;width:18px;height:18px;border-radius:4px;background:rgba(0,0,0,.66);color:#fff;display:grid;place-items:center}
.badge-vid .ic{width:13px;height:13px}
.meta{min-width:0;display:flex;flex-direction:column;flex:1}
.meta .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.fav-mark .ic{width:12px;height:12px;color:var(--rec);vertical-align:-1px;margin-right:4px}
.row.is-current .meta .t{color:var(--rec)}
.more,.handle{width:40px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--muted);flex:0 0 auto}
.handle{touch-action:none;cursor:grab;margin-left:-8px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-right:7px;vertical-align:-1px}
.eq i{width:3px;height:4px;background:var(--rec);border-radius:1px}
body.is-playing .eq i{animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.27s}.eq i:nth-child(3){animation-delay:-.55s}
@keyframes eq{from{height:3px}to{height:11px}}

.note{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
.note>div{flex:1;min-width:200px}
.note p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--well);border-top-color:var(--rec);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:24px 0 12px}
.empty h2{margin:0;font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:34ch}
.cassette{width:min(240px,70%);height:auto}
.cassette .reel{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}

/* listas */
.smart{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.smart-card{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:104px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:left}
.smart-card .ic{width:22px;height:22px;color:var(--rec)}
.smart-card strong{display:block;font-size:14px;line-height:1.2}
.smart-card small{font:12px var(--f-lcd);color:var(--muted)}
.mosaic{flex:0 0 52px;width:52px;height:52px;border-radius:8px;overflow:hidden;background:var(--well);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mosaic.one img{grid-column:1/3;grid-row:1/3}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic.sm{flex-basis:40px;width:40px;height:40px;border-radius:6px}
.mosaic.big{flex-basis:112px;width:112px;height:112px;border-radius:12px;box-shadow:0 10px 26px var(--shade)}
.mosaic .blank{display:grid;place-items:center;grid-column:1/3;grid-row:1/3;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-weight:600;padding:6px 0;margin:2px 0 6px -6px}
.pl-head{display:flex;gap:16px;align-items:flex-end;margin:4px 0 16px}
.pl-info{min-width:0;display:flex;flex-direction:column;gap:2px}
.pl-info h1{overflow-wrap:anywhere}
.pl-info .s{color:var(--muted);font-size:13px}

/* ajustes */
.set-group{margin:0 0 20px}
.set-group h2{font-family:var(--f-panel);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:400}
.set-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row.col{flex-direction:column;align-items:stretch}
.lbl{flex:1;min-width:180px;font-weight:600}
.lbl small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.meter{height:12px;background:var(--lcd);border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}
.meter i{display:block;height:100%;min-width:3px;background:repeating-linear-gradient(90deg,var(--lcd-ink) 0 6px,transparent 6px 8px)}
.switch{width:50px;height:30px;border-radius:15px;border:0;background:var(--well);position:relative;flex:0 0 auto;box-shadow:inset 0 1px 3px var(--shade)}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:linear-gradient(var(--key-top),var(--key-bot));box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .18s}
.switch[aria-checked="true"]{background:var(--rec)}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.foot{color:var(--muted);font-size:13px;text-align:center;margin:8px 0 0}

/* mini reproductor */
.mini-wrap{padding:0 var(--gr) 8px var(--gl)}
.mini{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;position:relative;overflow:hidden;box-shadow:0 8px 20px var(--shade);touch-action:pan-y;user-select:none}
.mini-prog{position:absolute;left:0;top:0;height:2px;width:100%;background:var(--rec);transform-origin:left;transform:scaleX(0)}
.mini-body{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:0;transition:transform .2s}
.mini-body img{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--well);flex:0 0 auto}
.mini-btn{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:50%;flex:0 0 auto}
.mini-btn.play{background:var(--ink);color:var(--bg)}
.mini-btn.play .ic{width:20px;height:20px}

/* botonera inferior */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding:2px var(--gr) 4px var(--gl);background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:6px 0 4px;color:var(--muted);font-family:var(--f-panel);font-size:8px;letter-spacing:.12em;text-transform:uppercase}
.tab .led{width:5px;height:5px;border-radius:50%;background:var(--led-off)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .led{background:var(--rec);box-shadow:0 0 6px var(--rec)}

/* reproduciendo */
.np{position:fixed;inset:0;z-index:30;background:radial-gradient(130% 60% at 50% 0%,color-mix(in srgb,var(--tint) 34%,transparent),transparent 72%),var(--bg);transform:translateY(102%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s linear .34s;padding:env(safe-area-inset-top,0px) var(--gr) env(safe-area-inset-bottom,0px) var(--gl)}
.np.open{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s}
.np-inner{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.np-head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;padding-top:6px;touch-action:none}
.np-src{text-align:center;min-width:0;display:flex;flex-direction:column}
.np-src span:last-child{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-stage{flex:1 1 0;min-height:120px;container-type:size;display:grid;place-items:center;touch-action:none}
.np-art{width:min(100cqw,100cqh);height:min(100cqw,100cqh);border-radius:10px;object-fit:cover;background:var(--well);box-shadow:0 22px 48px var(--shade),0 0 0 1px color-mix(in srgb,var(--ink) 8%,transparent)}
#np-video{width:min(100cqw,calc(100cqh * var(--ar,1.7778)));aspect-ratio:var(--ar,1.7778);max-height:100cqh;border-radius:10px;background:#000;box-shadow:0 22px 48px var(--shade)}
.np-titles{display:flex;align-items:center;gap:6px}
.np-tt{flex:1;min-width:0}
.marquee{overflow:hidden;white-space:nowrap}
.marquee.scroll{mask-image:linear-gradient(90deg,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
#np-title{display:inline-block;font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.marquee.scroll #np-title{animation:mq var(--mq-dur,12s) linear infinite;padding-right:24px}
@keyframes mq{0%,18%{transform:translateX(0)}82%,100%{transform:translateX(var(--mq-dist,0))}}
#np-artist{color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav[aria-pressed="true"]{color:var(--rec)}
.fav .ic{width:26px;height:26px}

.lcd{background:var(--lcd);border-radius:12px;padding:9px 12px 8px;border:1px solid var(--lcd-edge);box-shadow:inset 0 2px 12px rgba(0,0,0,.75),0 1px 0 color-mix(in srgb,#fff 40%,transparent);color:var(--lcd-ink);font-family:var(--f-lcd);display:flex;flex-direction:column;gap:7px}
.lcd-row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;letter-spacing:.08em;text-shadow:0 0 8px color-mix(in srgb,var(--lcd-ink) 55%,transparent);font-variant-numeric:tabular-nums;white-space:nowrap}
.lcd-row .dim{color:var(--lcd-dim);text-shadow:none}
.lcd-times{font-size:16px;cursor:pointer;border:0;background:none;color:inherit;font-family:inherit;padding:0;width:100%}
#vu{width:100%;height:60px;display:block}
#wave{width:100%;height:42px;display:block;touch-action:none;cursor:pointer;border-radius:3px}

.keys{display:grid;grid-template-columns:1fr 1fr 1.45fr 1fr 1fr;gap:6px;padding:9px 7px 7px;background:var(--well);border-radius:14px;box-shadow:inset 0 2px 6px var(--shade)}
.key{position:relative;height:60px;border:0;border-radius:8px;background:linear-gradient(var(--key-top),var(--key-bot));box-shadow:0 5px 0 var(--key-edge),0 7px 12px var(--shade);transform:translateY(-3px);transition:transform .07s,box-shadow .07s;color:var(--ink);display:grid;place-items:center}
.key .ic{width:24px;height:24px}
.key-play .ic{width:28px;height:28px}
.key:active,.key[aria-pressed="true"]{transform:translateY(1px);box-shadow:0 1px 0 var(--key-edge),0 1px 3px var(--shade)}
.key .led{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--led-off)}
.key[aria-pressed="true"] .led{background:var(--rec);box-shadow:0 0 7px var(--rec)}
.key .badge1{position:absolute;bottom:7px;right:9px;font:10px var(--f-panel);color:var(--rec)}
.np-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.np-chips::-webkit-scrollbar{display:none}
.np-chips>:first-child{margin-left:auto}.np-chips>:last-child{margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto}
.chip .ic{width:17px;height:17px}
.chip[aria-pressed="true"]{border-color:var(--rec);color:var(--rec)}

/* hojas */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-backdrop{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88%;display:flex;flex-direction:column;background:var(--panel);border-radius:18px 18px 0 0;padding:6px var(--gr) calc(10px + env(safe-area-inset-bottom,0px)) var(--gl);transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 40px var(--shade)}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.open .sheet-backdrop{opacity:1}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px;flex:0 0 auto}
.sheet-title{margin:0 0 10px;font-size:18px}
.sheet-body{overflow-y:auto;min-height:0;overscroll-behavior:contain}
.sheet-head{display:flex;gap:12px;align-items:center;padding:0 0 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu{list-style:none;margin:0;padding:0}
.menu button{width:100%;display:flex;align-items:center;gap:14px;padding:12px 2px;border:0;background:none;text-align:left;font-size:15px;font-weight:500;border-radius:8px}
.menu button:active{background:var(--well)}
.menu button>.ic{color:var(--muted)}
.menu .danger,.menu .danger>.ic{color:var(--rec)}
.menu .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.menu .grow small{color:var(--muted);font-size:12.5px}
.menu .ok{color:var(--rec)}
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:12px}
.sheet-actions.sticky{position:sticky;bottom:0;background:var(--panel);padding-bottom:2px}
.ed-cover{display:flex;gap:14px;align-items:center}
.ed-cover img{width:84px;height:84px;border-radius:10px;object-fit:cover;background:var(--well)}
.newpl{display:flex;gap:8px;margin-bottom:8px}
.newpl input{flex:1;min-width:0}
.picks{list-style:none;margin:8px 0 0;padding:0}
.pick{display:flex;align-items:center;gap:12px;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick .box{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;flex:0 0 auto}
.pick .box .ic{width:16px;height:16px}
.pick input:checked~.box{background:var(--rec);border-color:var(--rec);color:var(--rec-ink)}
.pick.in{opacity:.55}
.pick input:focus-visible~.box{outline:2px solid var(--rec);outline-offset:2px}
.confirm-text{margin:0;color:var(--muted)}

/* avisos */
.toasts{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 var(--gr) 0 var(--gl)}
body.has-mini .toasts{bottom:calc(142px + env(safe-area-inset-bottom,0px))}
body.np-open .toasts{bottom:auto;top:calc(60px + env(safe-area-inset-top,0px))}
body.sheet-open .toasts{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
.toast{pointer-events:auto;max-width:520px;width:100%;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:10px;font-size:14px;box-shadow:0 10px 28px var(--shade);animation:tin .22s ease-out}
.toast span{flex:1;min-width:0}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px}
.toast.out{opacity:0;transform:translateY(6px);transition:.2s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
body.drop::after{content:"Suelta aquí tus MP3 y MP4";position:fixed;inset:12px;z-index:80;border:2px dashed var(--rec);border-radius:16px;background:color-mix(in srgb,var(--bg) 88%,transparent);display:grid;place-items:center;font:600 18px var(--f-ui);color:var(--ink)}

/* filas anchas (miniatura 16:9, estilo lista de vídeos) */
.row.wide{border-bottom:0;align-items:center;border-radius:12px;padding:0 4px 0 0}
.row.wide .row-main{align-items:flex-start;gap:12px;padding:6px 0}
.row.wide.is-current{background:color-mix(in srgb,var(--rec) 10%,transparent)}
.row.wide.is-current .meta .t2{color:var(--rec)}
.row.wide .handle{margin-left:-6px;width:34px}
.row.wide .more{align-self:flex-start;margin-top:2px}
.wthumb{position:relative;flex:0 0 auto;width:clamp(128px,44%,220px);aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--well)}
.wthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.wthumb img:not([src]){visibility:hidden}
.wthumb img.bg{filter:blur(12px) saturate(1.25) brightness(.8);transform:scale(1.3)}
.wthumb img.fg.sq{left:50%;width:auto;aspect-ratio:1;transform:translateX(-50%);box-shadow:0 0 18px rgba(0,0,0,.45)}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.74);color:#fff;font:600 12px/1 var(--f-ui);padding:4px 5px;border-radius:5px;font-variant-numeric:tabular-nums}
.now{position:absolute;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center}
.now .eq{height:16px;margin:0}.now .eq i{width:4px;background:#fff}
@keyframes eq2{from{height:4px}to{height:16px}}
body.is-playing .now .eq i{animation-name:eq2}
.meta .t2{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row.wide .meta{gap:2px;padding-top:1px}
.row.wide .meta .s{font-size:13px}

/* reproductor en modo lista */
.np-bg,.ov,.ov-bar,.ov-seek,.np-listpanel{display:none}
.np-head{grid-template-columns:40px 1fr auto}
.np-head-r{display:flex}
.np[data-layout="list"] .np-inner{max-width:760px;gap:10px;padding-bottom:0}
.np[data-layout="list"] .np-head{padding-top:2px}
.np[data-layout="list"] .np-stage{flex:0 0 auto;display:block;position:relative;aspect-ratio:16/9;container-type:normal;min-height:0;background:#000;overflow:hidden;border-radius:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
@media (max-width:760px){.np[data-layout="list"] .np-stage{margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));border-radius:0}}
.np[data-layout="list"] #np-video{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;max-height:none;border-radius:0;box-shadow:none;object-fit:contain}
.np[data-layout="list"] .np-art{position:absolute;inset:0;margin:auto;height:84%;width:auto;max-width:92%;aspect-ratio:auto;object-fit:contain;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.np[data-layout="list"] .np-bg{display:block;position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(26px) brightness(.55) saturate(1.3)}
.np[data-layout="list"] .np-bg:not([src]){visibility:hidden}
.np[data-layout="list"] .ov{display:block;position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.45));opacity:0;pointer-events:none;transition:opacity .2s;color:#fff}
.np[data-layout="list"] .np-stage.show-ov .ov{opacity:1;pointer-events:auto}
.ov-mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(20px,12%,64px);pointer-events:none}
.ov-mid button{pointer-events:auto}
.ov button{border:0;background:rgba(0,0,0,.32);color:#fff;border-radius:50%;width:52px;height:52px;display:grid;place-items:center}
.ov button .ic{width:26px;height:26px}
.ov #ov-play{width:68px;height:68px}
.ov #ov-play .ic{width:34px;height:34px}
.ov-time{position:absolute;left:14px;bottom:16px;font:600 13px/1 var(--f-ui);font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ov .ov-full{position:absolute;right:6px;bottom:4px;background:none;width:44px;height:44px}
.np[data-layout="list"] .ov-bar{display:block;position:absolute;left:0;right:0;bottom:0;height:20px;cursor:pointer;touch-action:none;z-index:2}
.ov-bar::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.28)}
.ov-bar i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--rec);transform-origin:left;transform:scaleX(0)}
.ov-bar b{position:absolute;bottom:-5px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--rec);transform:scale(0);transition:transform .15s}
.show-ov .ov-bar b,.ov-bar.active b{transform:scale(1)}
.np[data-layout="list"] .ov-seek{display:grid;place-items:center;position:absolute;top:0;bottom:0;width:34%;color:#fff;font:700 15px var(--f-ui);background:rgba(255,255,255,.14);opacity:0;pointer-events:none;transition:opacity .35s}
.ov-seek.l{left:0;border-radius:0 50% 50% 0}.ov-seek.r{right:0;border-radius:50% 0 0 50%}
.ov-seek.on{opacity:1;transition:none}
.np-stage:fullscreen{aspect-ratio:auto!important;width:100%;height:100%;margin:0!important;border-radius:0!important}
.np[data-layout="list"] #np-title{font-size:19px}
.np[data-layout="list"] #np-artist{font-size:14px}
.np[data-layout="list"] .lcd,.np[data-layout="list"] .keys,.np[data-layout="list"] #c-queue{display:none}
.np[data-layout="list"] .np-chips>:first-child{margin-left:0}
.np[data-layout="list"] .np-listpanel{display:block;flex:1 1 auto;min-height:0;overflow-y:auto;position:relative;background:var(--panel);border-radius:18px 18px 0 0;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:0 var(--gr) 16px var(--gl);overscroll-behavior:contain;box-shadow:0 -6px 22px var(--shade)}
@media (min-width:761px){.np[data-layout="list"] .np-listpanel{margin:0;padding:0 12px 16px}}
.lp-head{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;align-items:center;gap:6px;padding:12px 0 8px}
.lp-head::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
.lp-t{flex:1;min-width:0;display:flex;flex-direction:column;padding-top:6px}
.lp-t strong{font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-t span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lp-head .icon-btn[aria-pressed="true"]{color:var(--rec)}
.lp-head .icon-btn{position:relative}
.lp-head .badge1{position:absolute;right:7px;bottom:7px;font:9px var(--f-panel);color:var(--rec)}
.np-listpanel .rows{padding-top:2px}
.ov .ov-theater{display:none}
.ov .ov-pip{position:absolute;right:50px;bottom:4px;background:none;width:44px;height:44px}
.ov-vol{display:none}
@media (min-width:1000px){
  .np[data-layout="list"] .np-inner{max-width:1640px;container-type:inline-size;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto auto auto auto minmax(0,1fr);column-gap:24px;row-gap:12px;align-content:start}
  .np[data-layout="list"] .np-head{grid-column:1/-1;grid-row:1}
  .np[data-layout="list"] .np-stage{grid-column:1;grid-row:2;margin:0;border-radius:14px;aspect-ratio:auto;height:min(calc((100cqw - 424px) * 9 / 16), calc(100dvh - 210px));min-height:220px}
  .np[data-layout="list"] .np-titles{grid-column:1;grid-row:3;margin:0}
  .np[data-layout="list"] .np-chips{grid-column:1;grid-row:4;margin:0}
  .np[data-layout="list"] .np-listpanel{grid-column:2;grid-row:2/6;margin:0 0 16px;border-radius:16px;padding:0 12px 12px;box-shadow:none;border:1px solid var(--line)}
  .np[data-layout="list"] .ov .ov-theater{display:grid;position:absolute;right:50px;bottom:4px;background:none;width:44px;height:44px}
  .np[data-layout="list"] .ov .ov-pip{right:94px}
  /* modo teatro: el vídeo ocupa todo el ancho y la lista queda debajo */
  .np.theater[data-layout="list"] .np-inner{max-width:none;overflow-y:auto;grid-template-rows:auto auto auto auto auto;padding-bottom:16px}
  .np.theater[data-layout="list"] .np-stage{grid-column:1/-1;margin:0;border-radius:12px;height:min(calc(100cqw * 9 / 16), calc(100dvh - 120px))}
  .np.theater[data-layout="list"] .np-titles,.np.theater[data-layout="list"] .np-chips{max-width:900px}
  .np.theater[data-layout="list"] .np-listpanel{grid-row:3/6;height:calc(100dvh - 140px);margin-bottom:0}
}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 12px;margin-top:6px}
.card{display:flex;flex-direction:column;gap:4px;border:0;background:none;text-align:left;padding:0;min-width:0;color:var(--ink)}
.card .cv{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--well);box-shadow:0 6px 16px var(--shade);margin-bottom:4px}
.card.artist .cv{border-radius:50%}
.card .cv img{width:100%;height:100%;object-fit:cover;display:block}
.card .cv img:not([src]){visibility:hidden}
.card strong{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.artist strong,.card.artist small{text-align:center}
.card small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:active .cv{transform:scale(.98)}
.toolbar .seg.small{flex:0 1 auto}
.np-listpanel .row{background:var(--panel)}
.cloud-mark .ic{width:13px;height:13px;color:var(--muted);vertical-align:-2px;margin-right:4px}
.row.unavail{opacity:.45}
.lp-mini{display:none}
@media (min-width:1000px){ #lp-collapse{display:none} }
@media (max-width:999px){
  .lp-head{touch-action:none}
  @media (max-height:720px){ .np.lp-collapsed[data-layout="list"] .keys{display:none!important} }
  @media (max-height:600px){ .np.lp-collapsed[data-layout="list"] .lcd{display:none!important} }
  .np.lp-collapsed[data-layout="list"] .np-listpanel{flex:0 0 auto;margin-top:auto;overflow:hidden;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .np.lp-collapsed[data-layout="list"] .lp-head,.np.lp-collapsed[data-layout="list"] #np-list{display:none}
  .np.lp-collapsed[data-layout="list"] .lp-mini{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:14px 2px 6px;touch-action:none;position:relative}
  .np.lp-collapsed[data-layout="list"] .lp-mini::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
  .lp-mini-ic{width:40px;height:40px;border-radius:10px;background:var(--well);display:grid;place-items:center;color:var(--rec);flex:0 0 auto}
  .lp-mini .meta .t{font-size:14.5px}
  .lp-mini .meta .t b{font-weight:700}
  .lp-mini-up{color:var(--muted);flex:0 0 auto;display:grid;place-items:center;width:36px}
  .np.lp-collapsed[data-layout="list"] .lcd{display:flex}
  .np.lp-collapsed[data-layout="list"] .keys{display:grid}
}
/* ratón: controles abajo, estilo reproductor de escritorio */
@media (hover:hover) and (pointer:fine){
  .np[data-layout="list"] .ov{display:flex;align-items:flex-end;gap:2px;padding:0 10px 10px;background:linear-gradient(transparent 50%, rgba(0,0,0,.7))}
  .np[data-layout="list"] .ov .ov-mid{position:static;display:contents}
  .np[data-layout="list"] .ov button,.np[data-layout="list"] .ov #ov-play{width:42px;height:42px;background:none;border-radius:8px;position:static}
  .np[data-layout="list"] .ov button:hover{background:rgba(255,255,255,.14)}
  .np[data-layout="list"] .ov button .ic,.np[data-layout="list"] .ov #ov-play .ic{width:24px;height:24px}
  .np[data-layout="list"] .ov-time{position:static;margin:0 10px 13px 6px;font-size:13.5px}
  .np[data-layout="list"] .ov .ov-pip{position:static;margin-left:auto;width:42px;height:42px}
  .np[data-layout="list"] .ov .ov-pip[hidden] + .ov-theater{margin-left:auto}
  .np[data-layout="list"] .ov .ov-theater{position:static;width:42px;height:42px}
  .np[data-layout="list"] .ov-vol{display:flex;align-items:center}
  #ov-volr{width:0;opacity:0;margin:0;accent-color:#fff;transition:width .18s,opacity .18s,margin .18s;cursor:pointer}
  .ov-vol:hover #ov-volr,#ov-volr:focus-visible,#ov-volr:active{width:84px;opacity:1;margin:0 8px 0 2px}
  .np[data-layout="list"] .ov-bar{left:12px;right:12px;bottom:52px;transition:opacity .2s}
  .np[data-layout="list"] .np-stage:not(.show-ov) .ov-bar{opacity:0}
  .np[data-layout="list"] .np-stage.show-ov{cursor:default}
  .np[data-layout="list"] .np-stage:not(.show-ov){cursor:none}
}
@media (hover:hover) and (pointer:fine) and (max-width:999px){
  .np[data-layout="list"] .ov .ov-pip[hidden] ~ .ov-full{margin-left:auto}
}

@media (min-width:700px){
  .vh h1{font-size:36px}
  .np-inner{gap:14px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="led-rec" aria-hidden="true"></span><span>PLETINA</span></div>
    <span class="counter" id="counter" aria-live="polite">000 PISTAS</span>
    <button class="icon-btn" id="btn-search" aria-label="Buscar"></button>
  </header>
  <div class="searchbar" id="searchbar" hidden>
    <input type="search" id="q" placeholder="Canción, artista o álbum" autocomplete="off" aria-label="Buscar en la biblioteca">
    <button class="link" id="q-close" type="button">Cerrar</button>
  </div>
  <main id="view" tabindex="-1"></main>
  <div class="mini-wrap" id="mini-wrap" hidden>
    <div class="mini" id="mini">
      <span class="mini-prog" id="mini-prog"></span>
      <button class="mini-body" id="mini-open" type="button" aria-label="Abrir el reproductor">
        <img id="mini-art" alt="">
        <span class="meta"><span class="t" id="mini-title"></span><span class="s" id="mini-artist"></span></span>
      </button>
      <button class="mini-btn play" id="mini-play" type="button" aria-label="Reproducir"></button>
      <button class="mini-btn" id="mini-next" type="button" aria-label="Siguiente"></button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Secciones">
    <button class="tab" data-view="library" type="button"><span class="led"></span><span data-ic="tape"></span>Biblioteca</button>
    <button class="tab" data-view="lists" type="button"><span class="led"></span><span data-ic="lists"></span>Listas</button>
    <button class="tab" data-view="queue" type="button"><span class="led"></span><span data-ic="queue"></span>Cola</button>
    <button class="tab" data-view="settings" type="button"><span class="led"></span><span data-ic="sliders"></span>Ajustes</button>
  </nav>
</div>

<section class="np" id="np" aria-hidden="true" aria-label="Reproduciendo">
  <div class="np-inner">
    <header class="np-head" id="np-head">
      <button class="icon-btn" id="np-close" type="button" aria-label="Cerrar el reproductor"></button>
      <div class="np-src"><span class="eyebrow">Reproduciendo desde</span><span id="np-src">Biblioteca</span></div>
      <div class="np-head-r">
        <button class="icon-btn" id="np-layout" type="button" aria-label="Cambiar vista"></button>
        <button class="icon-btn" id="np-more" type="button" aria-label="Más opciones"></button>
      </div>
    </header>
    <div class="np-stage" id="np-stage">
      <img class="np-bg" id="np-bg" alt="" aria-hidden="true">
      <img class="np-art" id="np-art" alt="">
      <video id="np-video" playsinline preload="auto" hidden></video>
      <span class="ov-seek l" id="ov-sl" aria-hidden="true">−10 s</span>
      <span class="ov-seek r" id="ov-sr" aria-hidden="true">+10 s</span>
      <div class="ov" id="ov">
        <div class="ov-mid">
          <button id="ov-prev" type="button" aria-label="Anterior"></button>
          <button id="ov-play" type="button" aria-label="Reproducir"></button>
          <button id="ov-next" type="button" aria-label="Siguiente"></button>
        </div>
        <div class="ov-vol"><button id="ov-mute" type="button" aria-label="Silenciar (M)"></button><input type="range" id="ov-volr" min="0" max="1" step="0.02" value="1" aria-label="Volumen"></div>
        <span class="ov-time" id="ov-time">0:00 / 0:00</span>
        <button class="ov-pip" id="ov-pip" type="button" aria-label="Ventana flotante (P)" hidden></button>
        <button class="ov-theater" id="ov-theater" type="button" aria-label="Modo teatro (T)"></button>
        <button class="ov-full" id="ov-full" type="button" aria-label="Pantalla completa (F)"></button>
      </div>
      <div class="ov-bar" id="ov-bar" role="slider" tabindex="0" aria-label="Posición" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="ov-fill"></i><b id="ov-dot"></b></div>
    </div>
    <div class="np-titles">
      <div class="np-tt">
        <div class="marquee" id="np-mq"><span id="np-title"></span></div>
        <div id="np-artist"></div>
      </div>
      <button class="icon-btn fav" id="np-fav" type="button" aria-pressed="false" aria-label="Favorita"></button>
    </div>
    <div class="lcd" id="lcd">
      <div class="lcd-row"><span id="lcd-state">■ STOP</span><span id="lcd-flags" class="dim"></span></div>
      <canvas id="vu" aria-hidden="true"></canvas>
      <canvas id="wave" tabindex="0" role="slider" aria-label="Posición en la pista" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></canvas>

function restoreState(st){
  if (!st) return;
  S.shuffle = !!st.shuffle; S.repeat = ['off', 'all', 'one'].includes(st.repeat) ? st.repeat : 'off';
  S.source = st.source || S.source;
  S.queue = (st.queue || []).filter(id => S.tracks.has(id));
  S.orig = st.orig ? st.orig.filter(id => S.tracks.has(id)) : null;
  if (st.currentId && S.tracks.has(st.currentId)){
    S.currentId = st.currentId; S.resumeAt = st.pos || 0;
    S.index = S.queue.indexOf(st.currentId);
    if (S.index < 0){ S.queue.unshift(st.currentId); S.index = 0; }
  } else S.index = Math.min(st.index ?? -1, S.queue.length - 1);
  const t = cur();
  if (t){ engine = audio; updateTrackUI(); updateMS(t); }

}

function libraryIds(){
  let arr = [...S.tracks.values()]; const f = S.settings.filter;
  if (f === 'audio') arr = arr.filter(t => t.kind === 'audio');
  else if (f === 'video') arr = arr.filter(t => t.kind === 'video');
  else if (f === 'fav') arr = arr.filter(t => t.fav);
  if (S.query){ const q = norm(S.query); arr = arr.filter(t => norm(t.title + ' ' + t.artist + ' ' + t.album + ' ' + t.fileName).includes(q)); }
  const s = S.settings.sort;
  if (s === 'title') arr.sort((a, b) => coll.compare(a.title, b.title));
  else if (s === 'artist') arr.sort((a, b) => coll.compare(a.artist || '~', b.artist || '~') || coll.compare(a.album || '', b.album || '') || coll.compare(a.title, b.title));
  else if (s === 'plays') arr.sort((a, b) => ((b.plays || 0) - (a.plays || 0)) || ((b.lastPlayed || 0) - (a.lastPlayed || 0)));
  else arr.sort((a, b) => b.added - a.added);
  return arr.map(t => t.id);
}
const favIds = () => [...S.tracks.values()].filter(t => t.fav).sort((a, b) => b.added - a.added).map(t => t.id);
const topIds = () => [...S.tracks.values()].filter(t => t.plays > 0).sort((a, b) => (b.plays - a.plays) || (b.lastPlayed - a.lastPlayed)).slice(0, 50).map(t => t.id);
const recentIds = () => [...S.tracks.values()].sort((a, b) => b.added - a.added).slice(0, 50).map(t => t.id);

  top: { name: 'Más escuchadas', ic: 'bars', ids: topIds, empty: 'Aquí aparecen las canciones que escuchas más de 30 segundos.' },
  recent: { name: 'Recientes', ic: 'clock', ids: recentIds, empty: 'Las últimas 50 pistas que añadiste.' },

const primaryArtist = a => (String(a || '').split(/\s*(?:,|;|&|\/|\bfeat\.?|\bft\.?|\bx\b|\bcon\b|\bwith\b)\s*/i)[0] || '').trim() || 'Artista desconocido';
const albumKey = a => norm(a).replace(/\s*[\[(].*?[\])]\s*/g, ' ').trim();
function groupBy(ids, keyFn){
  const m = new Map();
  for (const id of ids){ const t = S.tracks.get(id); if (!t) continue; const k = keyFn(t); if (!k) continue; if (!m.has(k)) m.set(k, []); m.get(k).push(id); }
  return m;
}
const byAlbumOrder = (a, b) => { const x = S.tracks.get(a), y = S.tracks.get(b); return coll.compare(x.album || '~', y.album || '~') || coll.compare(x.fileName, y.fileName); };
function artistIds(name){ return [...S.tracks.values()].filter(t => primaryArtist(t.artist) === name).map(t => t.id).sort(byAlbumOrder); }
function albumIds(key){ return [...S.tracks.values()].filter(t => t.album && albumKey(t.album) === key).map(t => t.id).sort((a, b) => coll.compare(S.tracks.get(a).fileName, S.tracks.get(b).fileName)); }

  const c = new Map(); for (const id of ids){ const a = primaryArtist(S.tracks.get(id)?.artist); c.set(a, (c.get(a) || 0) + 1); }
  const top = [...c].sort((a, b) => b[1] - a[1]); return top.length > 2 && top[0][1] < ids.length / 2 ? 'Varios artistas' : (top[0]?.[0] || '');

async function deleteTracks(ids){
  const set = new Set(ids);
  if (set.has(S.currentId)){
    S.wantPlay = false; for (const el of [audio, audio2, video]){ el.pause(); el.removeAttribute('src'); try { el.load(); } catch {} }
    stopTail(); releaseSrc(S.src); S.src = null; S.url = null;
    S.currentId = null; S.index = -1; updatePlayState();
  }
  const curId = S.currentId;
  S.queue = S.queue.filter(id => !set.has(id)); if (S.orig) S.orig = S.orig.filter(id => !set.has(id));
  if (curId) S.index = S.queue.indexOf(curId);
  for (const p of S.playlists.values()){ const n = p.items.length; p.items = p.items.filter(id => !set.has(id)); if (p.items.length !== n){ p.updated = Date.now(); await DB.put('playlists', p); } }
  for (const id of ids){ S.tracks.delete(id); invalidateCover(id); await DB.del('tracks', id); await DB.del('blobs', id); await DB.del('covers', id); }
  updateTrackUI(); render(); saveStateNow();
}

  for (const id of S.tracks.keys()) invalidateCover(id);

    for (const [did, m] of Object.entries(doc.tracks || {})){
      const t = byDrive.get(did);
      if (t && (m.t || 0) > (t.metaT || 0)){ Object.assign(t, { title: m.title || t.title, artist: m.artist ?? t.artist, album: m.album ?? t.album, fav: !!m.fav, metaT: m.t }); await saveTrack(t); }
    }
    const tombs = new Map((S.tombs || []).map(x => [x.id, x.t]));
    for (const x of doc.tombs || []) if (!tombs.has(x.id) || tombs.get(x.id) < x.t) tombs.set(x.id, x.t);
    for (const [id, tt] of tombs){ const p = S.playlists.get(id); if (p && (p.updated || 0) <= tt){ S.playlists.delete(id); await DB.del('playlists', id); } }
    for (const rp of doc.playlists || []){

async function reorder(kind, from, to){

    const p = S.playlists.get(S.plId); if (!p) return;
    const items = p.items.filter(id => S.tracks.has(id)); const [x] = items.splice(from, 1); items.splice(to, 0, x);

  $('#lp-mini').addEventListener('click', () => setCollapsed(false));
  $('#np-layout').addEventListener('click', () => setLayout(listMode() ? 'deck' : 'list'));
  $('#ov-prev').innerHTML = icon('prev'); $('#ov-next').innerHTML = icon('next'); $('#ov-full').innerHTML = icon('expand');
  $('#ov-prev').addEventListener('click', () => { prev(); showOv(true); });
  $('#ov-next').addEventListener('click', () => { next(); showOv(true); });
  $('#ov-play').addEventListener('click', () => { buzz(10); togglePlay(); });
  $('#ov-full').addEventListener('click', toggleFull);
  $('#ov-theater').addEventListener('click', toggleTheater);
  $('#ov-pip').innerHTML = icon('pip');
  $('#ov-pip').addEventListener('click', togglePiP);
  try { video.setAttribute('autopictureinpicture', ''); } catch {}
  video.addEventListener('enterpictureinpicture', () => { $('#ov-pip').setAttribute('aria-pressed', 'true'); });
  video.addEventListener('leavepictureinpicture', () => { $('#ov-pip').setAttribute('aria-pressed', 'false'); setTimeout(switchEngine, 50); });
  document.addEventListener('fullscreenchange', () => {
    const fs = !!document.fullscreenElement;
    $('#ov-full').innerHTML = icon(fs ? 'shrink' : 'expand');
    $('#ov-full').setAttribute('aria-label', fs ? 'Salir de pantalla completa' : 'Pantalla completa');
    if (!fs){ fsByRotation = false; try { screen.orientation.unlock(); } catch {} }
  });
  /* girar el móvil con un vídeo: pantalla completa; volver a vertical: salir */
  let fsByRotation = false;
  const landscape = matchMedia('(orientation: landscape)');
  const onRotate = () => {
    const land = screen.orientation ? screen.orientation.type.startsWith('landscape') : landscape.matches;
    if (land && npOpen() && listMode() && engine === video && !video.hidden && !document.fullscreenElement){
      const st = $('#np-stage');
      if (st.requestFullscreen) st.requestFullscreen({ navigationUI: 'hide' }).then(() => { fsByRotation = true; showOv(true); }).catch(() => {});
    } else if (!land && document.fullscreenElement && fsByRotation) document.exitFullscreen().catch(() => {});
  };
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', onRotate);
  else landscape.addEventListener('change', onRotate);
  /* toques sobre el vídeo: uno muestra controles, dos a un lado saltan 10 s */
  const stage = $('#np-stage'); let lastTap = 0, lastX = 0, tapT = 0;
  stage.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && listMode()) showOv(true); });
  stage.addEventListener('pointerleave', e => { if (e.pointerType !== 'mouse' || !listMode() || !isPlaying()) return; clearTimeout(ovTimer); ovTimer = setTimeout(() => stage.classList.remove('show-ov'), 500); });
  stage.addEventListener('wheel', e => { if (!listMode() || !S.currentId) return; e.preventDefault(); setVolume((S.settings.muted ? 0 : (S.settings.volume ?? 1)) + (e.deltaY < 0 ? 0.05 : -0.05)); showOv(true); }, { passive: false });
  $('#ov-mute').addEventListener('click', () => { toggleMute(); showOv(true); });
  $('#ov-volr').addEventListener('input', e => { setVolume(+e.target.value); showOv(true); });
  stage.addEventListener('click', e => {
    if (!listMode()){ if (e.target === video) togglePlay(); return; }
    if (e.target.closest('button,.ov-bar,.ov-vol')) return;
    if (e.pointerType === 'mouse'){
      clearTimeout(tapT);
      if (e.detail >= 2){ toggleFull(); return; }
      tapT = setTimeout(() => { togglePlay(); showOv(true); }, 230);
      return;
    }
    if ($('#np').dataset.drag === '1'){ $('#np').dataset.drag = ''; return; }
    const r = stage.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, now = performance.now(), side = x < 0.38 ? 'l' : x > 0.62 ? 'r' : '';
    if (side && now - lastTap < 330 && Math.abs(x - lastX) < 0.3){ clearTimeout(tapT); seekBy(side === 'l' ? -10 : 10); flashSeek(side); lastTap = now; return; }
    lastTap = now; lastX = x; clearTimeout(tapT);
    tapT = setTimeout(() => showOv(!stage.classList.contains('show-ov')), side ? 250 : 0);
  });
  stage.addEventListener('dblclick', e => { if (listMode()) e.preventDefault(); });
  /* barra de progreso del vídeo */
  const bar = $('#ov-bar');
  const br = e => { const r = bar.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1); };
  bar.addEventListener('pointerdown', e => { if (!S.currentId) return; e.stopPropagation(); try { bar.setPointerCapture(e.pointerId); } catch {} bar.classList.add('active'); scrub = br(e); updateTimes(); clearTimeout(ovTimer); });
  bar.addEventListener('pointermove', e => { if (scrub == null) return; scrub = br(e); updateTimes(); });
  bar.addEventListener('pointerup', () => { if (scrub == null) return; const r = scrub; scrub = null; bar.classList.remove('active'); seekTo(r * duration()); showOv(true); });
  bar.addEventListener('pointercancel', () => { scrub = null; bar.classList.remove('active'); updateTimes(); });
  bar.addEventListener('keydown', e => { if (e.key === 'ArrowRight'){ seekBy(5); e.preventDefault(); } else if (e.key === 'ArrowLeft'){ seekBy(-5); e.preventDefault(); } });

  $('#file-in').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) importFiles(f); });
  $('#folder-in').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) importFiles(f); });
  $('#pack-in').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importPack(f); });
  $('#backup-in').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });
  $('#cover-in').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (!f || !coverCb) return; try { coverCb(await shrinkImage(f)); } catch { toast('No pude leer esa imagen.'); } });

  /* mini reproductor: toque abre, deslizar cambia de pista */
  const mini = $('#mini'), mb = $('#mini-open'); let sx = 0, sy = 0, dx = 0, active = false, moved = false, pid = null, suppress = false;
  mini.addEventListener('pointerdown', e => { if (e.target.closest('.mini-btn')) return; active = true; moved = false; sx = e.clientX; sy = e.clientY; dx = 0; pid = e.pointerId; });
  mini.addEventListener('pointermove', e => {
    if (!active || e.pointerId !== pid) return; dx = e.clientX - sx; const dy = e.clientY - sy;
    if (!moved && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)){ moved = true; try { mini.setPointerCapture(pid); } catch {} }
    if (moved){ mb.style.transition = 'none'; mb.style.transform = `translateX(${dx * 0.6}px)`; mb.style.opacity = String(1 - Math.min(0.6, Math.abs(dx) / 300)); }
  });
  const endSwipe = () => { if (!active) return; active = false; mb.style.transition = ''; mb.style.transform = ''; mb.style.opacity = ''; if (moved){ suppress = true; setTimeout(() => suppress = false, 350); if (dx < -60) next(); else if (dx > 60) prev(); } };
  mini.addEventListener('pointerup', endSwipe); mini.addEventListener('pointercancel', endSwipe);
  mb.addEventListener('click', () => { if (suppress) return; openNP(); });
  $('#mini-play').addEventListener('click', togglePlay);
  $('#mini-next').addEventListener('click', () => next());

  /* frontal */
  $('#np-close').addEventListener('click', () => closeNP());
  $('#np-more').addEventListener('click', () => S.currentId && trackMenu(S.currentId));
  $('#np-fav').addEventListener('click', () => S.currentId && toggleFav(S.currentId));
  $('#k-play').addEventListener('click', () => { buzz(12); togglePlay(); });
  $('#k-prev').addEventListener('click', () => { buzz(8); prev(); });
  $('#k-next').addEventListener('click', () => { buzz(8); next(); });
  $('#k-shuf').addEventListener('click', toggleShuffle);
  $('#k-rep').addEventListener('click', cycleRepeat);
  $('#c-sleep').addEventListener('click', sleepSheet);
  $('#c-speed').addEventListener('click', cycleSpeed);
  $('#c-video').addEventListener('click', () => { S.settings.audioOnly = !S.settings.audioOnly; saveSettings(); updateTrackUI(); switchEngine(); });
  $('#c-addto').addEventListener('click', () => S.currentId && addToPlaylistSheet([S.currentId]));
  $('#c-queue').addEventListener('click', () => { closeNP(); setView('queue'); });
  $('#lcd-times').addEventListener('click', () => { S.showTotal = !S.showTotal; updateTimes(); });
  video.addEventListener('click', togglePlay);
  video.addEventListener('dblclick', () => { try { video.requestFullscreen && video.requestFullscreen(); } catch {} });

  /* deslizar hacia abajo para cerrar */
  const np = $('#np');
  for (const z of [$('#np-head'), $('#np-stage')]){
    let st = null;
    z.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; st = { y: e.clientY, id: e.pointerId, dy: 0 }; });
    z.addEventListener('pointermove', e => { if (!st || e.pointerId !== st.id) return; st.dy = Math.max(0, e.clientY - st.y); if (st.dy > 8){ try { z.setPointerCapture(st.id); } catch {} np.style.transition = 'none'; np.style.transform = `translateY(${st.dy}px)`; } });
    const end = () => { if (!st) return; const d = st.dy; st = null; np.style.transition = ''; np.style.transform = ''; if (d > 110) closeNP(); };
    z.addEventListener('pointerup', end); z.addEventListener('pointercancel', end);
  }

  /* forma de onda: tocar y arrastrar para buscar */
  const wave = $('#wave');
  const ratio = e => { const r = wave.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1); };
  wave.addEventListener('pointerdown', e => { if (!S.currentId) return; try { wave.setPointerCapture(e.pointerId); } catch {} scrub = ratio(e); markDirty(); updateTimes(); });
  wave.addEventListener('pointermove', e => { if (scrub == null) return; scrub = ratio(e); markDirty(); updateTimes(); });
  wave.addEventListener('pointerup', () => { if (scrub == null) return; const r = scrub; scrub = null; seekTo(r * duration()); });
  wave.addEventListener('pointercancel', () => { scrub = null; markDirty(); });
  wave.addEventListener('keydown', e => { if (e.key === 'ArrowRight'){ seekBy(5); e.preventDefault(); } else if (e.key === 'ArrowLeft'){ seekBy(-5); e.preventDefault(); } });
  if ('ResizeObserver' in window) new ResizeObserver(() => { if (npOpen()) sizeCanvases(); }).observe($('#lcd'));

  /* motores de audio y vídeo */
  for (const el of [audio, audio2, video]){
    el.addEventListener('timeupdate', e => { if (e.target === engine) onTime(); });
    el.addEventListener('play', e => { if (e.target === engine){ S.wantPlay = true; updatePlayState(); } });
    el.addEventListener('pause', e => {
      if (e.target !== engine) return;
      if (document.visibilityState === 'hidden' && engine === video && S.wantPlay && !inPiP()){ switchEngine(); return; }
      if (!engine.ended) S.wantPlay = false; updatePlayState();
    });
    el.addEventListener('ended', e => { if (e.target === engine) onEnded(); });
    el.addEventListener('loadedmetadata', e => {
      if (e.target !== engine) return; const t = cur();
      if (t && isFinite(engine.duration) && engine.duration > 0 && Math.abs((t.duration || 0) - engine.duration) > 1){ t.duration = engine.duration; saveTrack(t); }
      if (engine === video && video.videoWidth) document.documentElement.style.setProperty('--ar', (video.videoWidth / video.videoHeight).toFixed(4));
      updateTimes(); markDirty();
    });
    el.addEventListener('error', e => {
      if (e.target !== engine || !engine.getAttribute('src')) return;
      const t = cur(); toast(`No se pudo reproducir «${t?.title || 'esta pista'}». Paso a la siguiente.`);
      S.wantPlay = true; setTimeout(() => next(true), 900);
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden'){ saveStateNow(); if (engine === video && S.wantPlay) setTimeout(() => { if (document.visibilityState === 'hidden' && !inPiP()) switchEngine(); }, 350); }
    else { switchEngine(); if (S.sleepUntil) updateSleepUI(); }
  });
  window.addEventListener('pagehide', saveStateNow);

  document.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea,select,[contenteditable]') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest('.sheet-wrap')) return;
    if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight' && e.target.id !== 'wave'){ e.shiftKey ? next() : seekBy(10); }
    else if (e.key === 'ArrowLeft' && e.target.id !== 'wave'){ e.shiftKey ? prev() : seekBy(-10); }
    else if (e.key === '/'){ e.preventDefault(); $('#btn-search').click(); }
    else if ((e.key === 't' || e.key === 'T') && npOpen() && listMode()) toggleTheater();
    else if ((e.key === 'f' || e.key === 'F') && npOpen() && listMode()) toggleFull();
    else if ((e.key === 'p' || e.key === 'P') && cur()?.kind === 'video'){ togglePiP(); }
    else if (e.key === 'm' || e.key === 'M'){ toggleMute(); if (npOpen()) showOv(true); }
    else if (e.key === 'Escape' && npOpen() && !document.fullscreenElement && !e.target.closest('.sheet-wrap')) closeNP();
  });

  window.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')){ e.preventDefault(); document.body.classList.add('drop'); } });
  window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drop'); });
  window.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drop'); const f = [...(e.dataTransfer?.files || [])]; if (f.length) importFiles(f); });

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.view === 'settings') render(); });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch {}
}

/* miniaturas 16:9 para vídeos importados con la versión anterior */
async function recaptureFrames(list){
  for (const t of list){
    while (S.importing) await sleep(800);
    try {
      const blob = await DB.get('blobs', t.id); if (!blob) continue;
      const pr = await probe(blob);
      if (pr.frame){ const st = await imageStats(pr.frame).catch(() => null); if (st && st.lum > 12){ await DB.put('covers', pr.frame, t.id); invalidateCover(t.id); t.tint = st.tint; } }
      t.wide = true; await saveTrack(t);
    } catch {}
    await sleep(200);
  }
  if (list.length){ render(); if (S.currentId) updateTrackUI(); }
}
/* ───────── arranque ───────── */
async function boot(){
  bindUI(); setupMS(); applyTheme(); applyLayout(); render();
  try { await DB.open(); } catch { DB.useMemory(); }
  let tracks = [], pls = [], settings = null, state = null, seeded = false;
  try { [tracks, pls, settings, state, seeded] = await Promise.all([DB.all('tracks'), DB.all('playlists'), DB.get('meta', 'settings'), DB.get('meta', 'state'), DB.get('meta', 'seeded')]); } catch (e) { console.warn(e); }
  for (const t of tracks) S.tracks.set(t.id, t);
  for (const p of pls) S.playlists.set(p.id, p);
  if (settings) Object.assign(S.settings, settings);
  S.booted = true;
  applyVolume();
  applyLayout();
  applyTheme(); restoreState(state); updateChips(); render();
  try { document.fonts && document.fonts.ready.then(() => { vuFace = null; markDirty(); setupMarquee(); }); } catch {}
  await checkInbox();
  if (!seeded && !S.tracks.size) seedDemos();
  try { S.tombs = (await DB.get('meta', 'tombs')) || []; } catch { S.tombs = []; }
  if (S.settings.driveOn && !inFrame){ loadTok(); loadGIS().catch(() => {}); if (tokValid()) setTimeout(() => syncDrive({ quiet: true }), 1500); }
  queueAnalysis([...S.tracks.values()].filter(t => t.env === undefined).map(t => t.id));
  recaptureFrames([...S.tracks.values()].filter(t => t.kind === 'video' && !t.wide));
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !inFrame) navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
})();
</script>
